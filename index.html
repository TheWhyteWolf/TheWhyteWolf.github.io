<script>
/* ── Half-hour rotation ───────────────────────────────────────────────
   One design per 30-minute interval, cycling through this list.
   Add or reorder filenames here to change what appears in the rotation.
   Preview any entry with ?i=0, ?i=1, …  ·  preview another interval with ?o=1 (next), ?o=-1 (previous).
   Intervals align with :00 and :30 UTC; an open view stays put until the next visit or reload. */
(function(){
  var ROTATION = [
    'v2-ascii-frames.html',   // 0
    'v4-directory.html',      // 1
    'v5-bbs.html',            // 2
    'v6-turbo-vision.html',   // 3
    'v7-greenbar.html',       // 4
    'v8-crt.html',            // 5
    'v9-teletype.html',       // 6
    'v10-teletext.html',      // 7
    'v11-manpage.html',       // 8
    'v12-workbench.html',     // 9
    'v13-zork.html',          // 10
    'v14-oscilloscope.html',  // 11
    'v15-punchcard.html',     // 12
    'v16-crimson.html',       // 13
    'v17-keep.html'           // 14
  ];
  try{
    var p = new URLSearchParams(location.search);
    var n = ROTATION.length;
    var forced = p.get('i');
    var offset = parseInt(p.get('o'),10); if(isNaN(offset)) offset = 0;
    var slot = Math.floor(Date.now()/1800000) + offset;
    var idx = (forced!==null && forced!=='') ? parseInt(forced,10) : slot;
    if(isNaN(idx)) idx = slot;
    idx = ((idx % n) + n) % n;
    var qs = [];
    if(p.get('intro') === '1') qs.push('intro=1');
    if(p.get('demo') === '1') qs.push('demo=1');
    var target = ROTATION[idx] + (qs.length ? '?' + qs.join('&') : '');
    location.replace(target);
  }catch(e){ /* fall through to the no-script list below */ }
})();
</script>
